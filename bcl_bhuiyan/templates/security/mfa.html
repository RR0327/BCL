<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Staff verification</title></head>
<body><main><h1>Staff two-factor authentication</h1>
{% if enrolling %}<p>Add this account to your authenticator app using the provisioning URI below. Keep this secret private.</p>
<p><code style="overflow-wrap:anywhere">{{ secret }}</code></p>{% endif %}
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<label>6-digit authenticator code <input name="token" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><button type="submit">Verify</button></form>
<form method="post" action="{% url 'bcl:logout' %}">{% csrf_token %}<button type="submit">Log out</button></form>
</main></body></html>
